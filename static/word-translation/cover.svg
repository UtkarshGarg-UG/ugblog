<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="alignedGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#95b078" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#95b078" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldMark" x1="0%" y1="60%" x2="0%" y2="60%">
      <stop offset="0%"   stop-color="transparent"/>
      <stop offset="60%"  stop-color="transparent"/>
      <stop offset="60%"  stop-color="rgba(200,168,56,0.22)"/>
      <stop offset="100%" stop-color="rgba(200,168,56,0.22)"/>
    </linearGradient>
  </defs>

  <!-- background: warm walnut -->
  <rect width="1200" height="630" fill="#1a1813"/>

  <!-- subtle sage halo around the aligned clouds -->
  <rect x="50" y="80" width="500" height="500" fill="url(#alignedGlow)"/>

  <!-- ============ Aligned clouds (left half) ============ -->
  <!-- 12 source/target pair positions in a 2D space centered around (300, 320), scale ≈ 130 -->
  <!-- For each pair, a sage dot + a caramel dot sitting adjacent (showing alignment) -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" text-anchor="middle">

    <!-- cat/gatto (top-left) -->
    <g transform="translate(220, 200)">
      <circle cx="-5" cy="0" r="5" fill="#d4895c"/>
      <circle cx="5"  cy="0" r="5" fill="#95b078"/>
      <text x="0" y="-14" fill="#e8dcc1" font-size="14" font-weight="600">cat</text>
      <text x="0" y="22"  fill="#95b078" font-size="14" font-weight="600">gatto</text>
    </g>

    <!-- king/re (top-right cluster) -->
    <g transform="translate(390, 180)">
      <circle cx="-5" cy="0" r="5" fill="#d4895c"/>
      <circle cx="5"  cy="0" r="5" fill="#95b078"/>
      <text x="0" y="-14" fill="#e8dcc1" font-size="14" font-weight="600">king</text>
      <text x="0" y="22"  fill="#95b078" font-size="14" font-weight="600">re</text>
    </g>

    <!-- queen/regina -->
    <g transform="translate(470, 250)">
      <circle cx="-5" cy="0" r="5" fill="#d4895c"/>
      <circle cx="5"  cy="0" r="5" fill="#95b078"/>
      <text x="0" y="-14" fill="#e8dcc1" font-size="14" font-weight="600">queen</text>
      <text x="0" y="22"  fill="#95b078" font-size="14" font-weight="600">regina</text>
    </g>

    <!-- water/acqua -->
    <g transform="translate(150, 340)">
      <circle cx="-5" cy="0" r="5" fill="#d4895c"/>
      <circle cx="5"  cy="0" r="5" fill="#95b078"/>
      <text x="0" y="-14" fill="#e8dcc1" font-size="14" font-weight="600">water</text>
      <text x="0" y="22"  fill="#95b078" font-size="14" font-weight="600">acqua</text>
    </g>

    <!-- three/tre -->
    <g transform="translate(310, 380)">
      <circle cx="-5" cy="0" r="5" fill="#d4895c"/>
      <circle cx="5"  cy="0" r="5" fill="#95b078"/>
      <text x="0" y="-14" fill="#e8dcc1" font-size="14" font-weight="600">three</text>
      <text x="0" y="22"  fill="#95b078" font-size="14" font-weight="600">tre</text>
    </g>

    <!-- red/rosso -->
    <g transform="translate(470, 410)">
      <circle cx="-5" cy="0" r="5" fill="#d4895c"/>
      <circle cx="5"  cy="0" r="5" fill="#95b078"/>
      <text x="0" y="-14" fill="#e8dcc1" font-size="14" font-weight="600">red</text>
      <text x="0" y="22"  fill="#95b078" font-size="14" font-weight="600">rosso</text>
    </g>

    <!-- background filler dots (texture) -->
    <g fill="#d4895c" opacity="0.55">
      <circle cx="180" cy="270" r="3"/>
      <circle cx="260" cy="295" r="3"/>
      <circle cx="350" cy="260" r="3"/>
      <circle cx="430" cy="330" r="3"/>
      <circle cx="380" cy="450" r="3"/>
      <circle cx="220" cy="450" r="3"/>
      <circle cx="280" cy="500" r="3"/>
      <circle cx="500" cy="350" r="3"/>
      <circle cx="160" cy="430" r="3"/>
      <circle cx="120" cy="240" r="3"/>
      <circle cx="320" cy="160" r="3"/>
    </g>
    <g fill="#95b078" opacity="0.55">
      <circle cx="190" cy="265" r="3"/>
      <circle cx="270" cy="300" r="3"/>
      <circle cx="360" cy="255" r="3"/>
      <circle cx="438" cy="335" r="3"/>
      <circle cx="388" cy="455" r="3"/>
      <circle cx="228" cy="445" r="3"/>
      <circle cx="290" cy="498" r="3"/>
      <circle cx="510" cy="354" r="3"/>
      <circle cx="168" cy="425" r="3"/>
      <circle cx="128" cy="243" r="3"/>
      <circle cx="328" cy="163" r="3"/>
    </g>
  </g>

  <!-- ============ Title block (right half) ============ -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#e8dcc1">
    <!-- Eyebrow / kicker -->
    <text x="640" y="180" font-size="16" letter-spacing="3.6" fill="#8a7e6d" font-weight="600">A BEAUTIFUL APPLICATION OF</text>
    <text x="640" y="206" font-size="16" letter-spacing="3.6" fill="#8a7e6d" font-weight="600">GANS AND LINEAR ALGEBRA</text>

    <!-- Title -->
    <text x="640" y="290" font-size="56" font-weight="800" fill="#e8dcc1">Word Translation</text>

    <!-- "Without Parallel Data" with gold marker highlight -->
    <g transform="translate(640, 358)">
      <!-- highlight band sits behind the text, gold marker style -->
      <rect x="-4" y="-44" width="588" height="58" fill="rgba(200, 168, 56, 0.22)"/>
      <text x="0" y="0" font-size="56" font-weight="800" fill="#c8a838">Without Parallel Data</text>
    </g>

    <!-- Subtitle -->
    <text x="640" y="430" font-size="22" fill="#a0967f">Two languages, learned independently,</text>
    <text x="640" y="460" font-size="22" fill="#a0967f">turn out to share the same shape.</text>

    <!-- Footer / author + dates of contributing ideas -->
    <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="13" fill="#5e5648" letter-spacing="0.8">
      <text x="640" y="540">word2vec · 2013   GAN · 2014   SVD/Procrustes · 1966   distributional · 1957</text>
    </g>
  </g>

  <!-- A subtle rotation arc indicator between the two halves -->
  <g stroke="#3a352d" stroke-width="1" fill="none" stroke-dasharray="3 5" opacity="0.6">
    <path d="M 580 315 Q 605 315 615 305" />
  </g>
</svg>
