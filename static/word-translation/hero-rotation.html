<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hero: language alignment</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #1a1813; color: #e8dcc1;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
    overflow: hidden;
  }
  .stage {
    width: 100%; height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 18px; box-sizing: border-box;
    position: relative;
  }
  .hint {
    position: absolute; top: 20px; left: 0; right: 0;
    text-align: center;
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #786c5b;
    transition: color 0.6s ease, opacity 0.4s ease;
    pointer-events: none;
  }
  .hint.en { color: #82a8c3; }
  .hint.it { color: #d4895c; }
  .hint.go { color: #e8dcc1; }
  .hint.done { color: #95b078; }
  canvas { display: block; width: 100%; max-width: 640px; height: auto; aspect-ratio: 1 / 1; }
  .legend {
    position: absolute; bottom: 20px; left: 0; right: 0;
    display: flex; justify-content: center; gap: 24px;
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: #786c5b;
  }
  .legend .item { display: flex; align-items: center; gap: 6px; }
  .legend .dot { width: 8px; height: 8px; border-radius: 50%; }
  .legend .en-dot { background: #82a8c3; }
  .legend .it-dot { background: #d4895c; }
  .replay {
    position: absolute; top: 14px; right: 14px;
    background: none; border: 1px solid #3a352d; color: #8a7e6d;
    width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; padding: 0; cursor: pointer; z-index: 10;
    transition: all 0.2s ease;
  }
  .replay:hover { border-color: #82a8c3; color: #82a8c3; }
</style>
</head>
<body>
<div class="stage">
  <div class="hint" id="hint">two languages, two embedding spaces</div>
  <button class="replay" id="replay" title="replay" aria-label="replay">↻</button>
  <canvas id="cv"></canvas>
  <div class="legend">
    <span class="item"><span class="dot en-dot"></span>english</span>
    <span class="item"><span class="dot it-dot"></span>italian</span>
  </div>
</div>
<script>
const pairs = [
  { en: 'king',   it: 're',      x: -1.30, y:  1.05 },
  { en: 'queen',  it: 'regina',  x: -0.45, y:  1.25 },
  { en: 'man',    it: 'uomo',    x: -1.25, y:  0.10 },
  { en: 'woman',  it: 'donna',   x: -0.40, y:  0.30 },
  { en: 'cat',    it: 'gatto',   x:  0.95, y:  1.10 },
  { en: 'dog',    it: 'cane',    x:  1.45, y:  0.55 },
  { en: 'bird',   it: 'uccello', x:  0.55, y:  0.50 },
  { en: 'three',  it: 'tre',     x: -0.95, y: -0.95 },
  { en: 'water',  it: 'acqua',   x:  0.15, y: -1.20 },
  { en: 'red',    it: 'rosso',   x:  1.00, y: -0.80 },
];

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const hint = document.getElementById('hint');

function fit() {
  const dpr = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect();
  cv.width = r.width * dpr;
  cv.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

const ROT = -50 * Math.PI / 180; // angle the Italian cloud is rotated from English

function applyRot(p, theta) {
  return {
    x: Math.cos(theta) * p.x - Math.sin(theta) * p.y,
    y: Math.sin(theta) * p.x + Math.cos(theta) * p.y,
  };
}

// Timeline (seconds)
const T_REVEAL_EN = 0.0;
const T_REVEAL_IT = 0.9;
const T_HOLD_MISALIGNED = 2.4;
const T_ROTATE_START = T_HOLD_MISALIGNED;
const T_ROTATE_END = T_ROTATE_START + 3.2;   // 5.6
const T_HOLD_ALIGNED_START = T_ROTATE_END;
const T_HOLD_ALIGNED_END = T_HOLD_ALIGNED_START + 4.0; // 9.6
const T_FADE_IT_OUT_END = T_HOLD_ALIGNED_END + 0.6;    // 10.2 (fade Italian into pairs label)
const T_LOOP = T_FADE_IT_OUT_END + 1.4;                // 11.6

function easeInOut(t) { return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2) / 2; }

let t0 = performance.now();

function clamp01(x) { return Math.max(0, Math.min(1, x)); }

function phase(t) {
  // Returns: { enAlpha, itAlpha, srcAngle (rotation applied to en cloud), labelMode }
  // We move the English cloud onto the Italian cloud by rotating it by ROT.
  // Italian cloud is at positions applyRot(pair, ROT).
  // English starts at pair positions (identity).
  let srcAngle = 0;
  let enAlpha = clamp01((t - T_REVEAL_EN) / 0.7);
  let itAlpha = clamp01((t - T_REVEAL_IT) / 0.7);
  let labelMode = 'separate'; // 'separate' | 'paired'

  if (t >= T_ROTATE_START && t < T_ROTATE_END) {
    const u = (t - T_ROTATE_START) / (T_ROTATE_END - T_ROTATE_START);
    srcAngle = ROT * easeInOut(u);
  } else if (t >= T_ROTATE_END) {
    srcAngle = ROT;
  }

  // Once aligned, swap label display to "paired" mode (en on top, it bottom of merged point)
  if (t >= T_HOLD_ALIGNED_START + 0.4) labelMode = 'paired';
  if (t >= T_FADE_IT_OUT_END) labelMode = 'paired';

  return { srcAngle, enAlpha, itAlpha, labelMode, t };
}

function draw() {
  const r = cv.getBoundingClientRect();
  const w = r.width, h = r.height;
  ctx.clearRect(0, 0, w, h);
  const cx = w/2, cy = h/2, scale = Math.min(w, h) * 0.27;

  const tNow = (performance.now() - t0) / 1000;
  let t = tNow % T_LOOP;

  const { srcAngle, enAlpha, itAlpha, labelMode } = phase(t);

  // Italian point positions (target)
  const it_pts = pairs.map(p => applyRot({ x: p.x, y: p.y }, ROT));
  // English point positions (rotated by srcAngle as the alignment proceeds)
  const en_pts = pairs.map(p => applyRot({ x: p.x, y: p.y }, srcAngle));

  // Subtle pair lines while in transition (faint, between en and it points)
  const showResidualLines = t > T_ROTATE_START && t < T_ROTATE_END + 0.4;
  if (showResidualLines) {
    let lineAlpha = 0.22;
    if (t > T_ROTATE_END) {
      lineAlpha = 0.22 * (1 - (t - T_ROTATE_END) / 0.4);
    }
    ctx.strokeStyle = `rgba(138, 126, 109, ${lineAlpha})`;
    ctx.lineWidth = 1;
    for (let i = 0; i < pairs.length; i++) {
      const a = en_pts[i], b = it_pts[i];
      ctx.beginPath();
      ctx.moveTo(cx + a.x * scale, cy - a.y * scale);
      ctx.lineTo(cx + b.x * scale, cy - b.y * scale);
      ctx.stroke();
    }
  }

  // Italian points (target, fixed)
  if (itAlpha > 0.001) {
    for (let i = 0; i < pairs.length; i++) {
      const p = it_pts[i];
      const px = cx + p.x * scale, py = cy - p.y * scale;
      ctx.fillStyle = `rgba(212, 137, 92, ${itAlpha * 0.95})`;
      ctx.beginPath(); ctx.arc(px, py, 5.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  // English points (rotating)
  if (enAlpha > 0.001) {
    for (let i = 0; i < pairs.length; i++) {
      const p = en_pts[i];
      const px = cx + p.x * scale, py = cy - p.y * scale;
      ctx.fillStyle = `rgba(130, 168, 195, ${enAlpha * 0.95})`;
      ctx.beginPath(); ctx.arc(px, py, 5.5, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Labels
  ctx.font = '600 13px -apple-system, BlinkMacSystemFont, sans-serif';
  ctx.textAlign = 'center';

  if (labelMode === 'separate') {
    // English labels above their points (blue)
    for (let i = 0; i < pairs.length; i++) {
      const p = en_pts[i];
      const px = cx + p.x * scale, py = cy - p.y * scale;
      ctx.fillStyle = `rgba(179, 200, 216, ${enAlpha})`;
      ctx.fillText(pairs[i].en, px, py - 12);
    }
    // Italian labels below their points (orange)
    for (let i = 0; i < pairs.length; i++) {
      const p = it_pts[i];
      const px = cx + p.x * scale, py = cy - p.y * scale;
      ctx.fillStyle = `rgba(228, 182, 148, ${itAlpha})`;
      ctx.fillText(pairs[i].it, px, py + 22);
    }
  } else {
    // Paired mode: both labels at the merged point, en above, it below
    for (let i = 0; i < pairs.length; i++) {
      const p = it_pts[i];
      const px = cx + p.x * scale, py = cy - p.y * scale;
      ctx.fillStyle = '#b3c8d8'; // English
      ctx.fillText(pairs[i].en, px, py - 12);
      ctx.fillStyle = '#e4b694'; // Italian
      ctx.fillText(pairs[i].it, px, py + 22);
    }
  }

  // Subtle aligned glow
  if (t > T_HOLD_ALIGNED_START && t < T_HOLD_ALIGNED_END + 1) {
    const glowAlpha = 0.12;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.min(w, h) * 0.5);
    g.addColorStop(0, `rgba(149, 176, 120, ${glowAlpha})`);
    g.addColorStop(1, 'rgba(149, 176, 120, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }

  // Update hint text + color
  let hintText = '';
  let hintCls = '';
  if (t < T_REVEAL_IT) { hintText = 'english embeddings'; hintCls = 'en'; }
  else if (t < T_HOLD_MISALIGNED) { hintText = 'italian embeddings'; hintCls = 'it'; }
  else if (t < T_ROTATE_END) { hintText = 'one rotation'; hintCls = 'go'; }
  else if (t < T_HOLD_ALIGNED_END) { hintText = 'cat = gatto · king = re · water = acqua'; hintCls = 'done'; }
  else { hintText = 'cat = gatto · king = re · water = acqua'; hintCls = 'done'; }

  if (hint.textContent !== hintText) hint.textContent = hintText;
  if (!hint.classList.contains(hintCls)) {
    hint.className = 'hint ' + hintCls;
  }
}

function loop() { draw(); requestAnimationFrame(loop); }

document.getElementById('replay').addEventListener('click', () => {
  t0 = performance.now();
});

window.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'restart') {
    t0 = performance.now();
  }
});

fit();
window.addEventListener('resize', fit);
loop();
</script>
</body>
</html>
